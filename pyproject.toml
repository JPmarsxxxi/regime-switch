[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regime-switch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "numba",
  "cvxpy",
  "ecos",
  "hmmlearn",
  "yfinance",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jumpmodels", "arch", "statsmodels"]

[tool.setuptools]
packages = ["regime_switch"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: simulation studies (run with -m slow)"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
